apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'frontend-service'
        static_configs:
          - targets: ['frontend-service:5000']
      - job_name: 'backend-service'
        static_configs:
          - targets: ['backend-service:5000']
      - job_name: 'database-service'
        static_configs:
          - targets: ['database-service:5000']
